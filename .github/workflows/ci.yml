name: Student API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: studentdb
          POSTGRES_USER: studentapp
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studentapp -d studentdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_NAME: studentdb
      DB_USER: studentapp
      DB_PASSWORD: ci-only-password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      JWT_EXPIRATION_MINUTES: "60"
      APP_BOOTSTRAP_USERNAME: ci-admin
      APP_BOOTSTRAP_PASSWORD: ci-only-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  sast:
    name: SAST - SpotBugs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and analyze Java code
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -DskipTests
          clean package
          com.github.spotbugs:spotbugs-maven-plugin:4.10.5.0:check
          -Dspotbugs.xmlOutput=true
          -Dspotbugs.htmlOutput=true

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: |
            target/spotbugsXml.xml
            target/**/spotbugs*.html
          if-no-files-found: warn
          retention-days: 14

  sca:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Get cache date
        id: cache-date
        run: echo "date=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Restore OWASP Dependency-Check database
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-nvd-${{ hashFiles('**/pom.xml') }}-dc13.0.0-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-owasp-nvd-${{ hashFiles('**/pom.xml') }}-dc13.0.0-
            ${{ runner.os }}-owasp-nvd-${{ hashFiles('**/pom.xml') }}-
            ${{ runner.os }}-owasp-nvd-

      - name: Scan dependencies for known vulnerabilities
        env:
          NVD_API_KEY: ${{ github.event_name != 'pull_request' && secrets.NVD_API_KEY || '' }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --batch-mode
            --no-transfer-progress
            -DnvdValidForHours=24
            org.owasp:dependency-check-maven:13.0.0:check
            -Dformats=HTML,JSON
            -DfailBuildOnCVSS=7
          )

          if [[ -n "${NVD_API_KEY:-}" ]]; then
            echo "NVD API key is configured."
            args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          else
            echo "::warning::NVD_API_KEY is unavailable; the scan may take longer."
          fi

          ./mvnw "${args[@]}"

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 14
